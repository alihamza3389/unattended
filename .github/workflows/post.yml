# Just after the day's first thought (03:14 UTC), carry it out to X and
# Bluesky with a link to its permanent address. Independent of the dream:
# the thought exists whether or not the night dreamt anything new.
#
# Requires per-platform secrets; a platform with none is simply skipped:
#   X: X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_TOKEN_SECRET
#   Bluesky: BLUESKY_IDENTIFIER BLUESKY_APP_PASSWORD

name: post

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "post to which platform"
        type: choice
        options: [both, x, bluesky]
        default: both

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: carry it out
        run: node scripts/post.mts --only "${{ inputs.only || 'both' }}"
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

      # Keep the note of what it said out loud, so it does not say it again.
      # This runs after the sending and can never undo it: if the record fails
      # to land, the post still went out, and the worst case is the repeat this
      # was written to prevent. It rebases first because the dream job pushes a
      # few minutes earlier and the two would otherwise race.
      - name: remember saying it
        continue-on-error: true
        run: |
          git diff --quiet corpus/spoken.jsonl && { echo "nothing new said"; exit 0; }
          git config user.name "unattended"
          git config user.email "unattended@users.noreply.github.com"
          git add corpus/spoken.jsonl
          git commit -m "said it out loud"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "push refused, retrying"
            sleep 5
          done
          echo "could not record it; it may repeat once"

